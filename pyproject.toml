[project]
name = "agent"
version = "0.1.0"
description = "A browser agent that chooses actions from a typed action space."
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.48,<2",
  "httpx[http2]>=0.28,<1",
  "pydantic>=2.9,<3",
  "asyncpg>=0.30,<1",
  "websockets>=13,<15",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
agent = "agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.14,<1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
asyncio_mode = "auto"
